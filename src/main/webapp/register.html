    <h1>Sign Up</h1>
    <h4>It is free and only takes a minute</h4>
    <form id="form" action="student-response.jsp">
      <label for="accountName">Account Name</label>
      <input id="accountName" name="accountName" type="text" placeholder="First Name">

      <input id="email" name="email" type="email" placeholder="ABC@example.com">

      <label for="password">Password</label>
      <input id="password" name="password" type="text" placeholder="Enter your password">

      <label for="cPassword">Confirm Password</label>
      <input id="cPassword" name="cPassword" type="text">

      <input type="submit" value="submit">
    </form>
